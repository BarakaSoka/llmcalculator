name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          # Full version sweep on Linux only; the matrix above already covers
          # the platform-specific detection paths at the version boundaries.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check the CLI runs on a bare machine
        run: |
          python -m llmcalculator.cli scan --json
          python -m llmcalculator.cli check llama3.1:8b --vram 24 --ram 64 --json
          python -m llmcalculator.cli models --json

  no-dependencies:
    name: Works with zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install without any extras
        run: python -m pip install .

      - name: Core and CLI must work without rich or textual
        run: |
          python -c "import rich" && exit 1 || echo "rich correctly absent"
          llmcalculator scan
          llmcalculator check llama3.1:8b --json
          python -c "import llmcalculator as lc; assert lc.check('llama3.1:8b').fits"

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check --strict dist/*

      - name: Confirm data files are packaged
        run: |
          python -m zipfile -l dist/*.whl | grep catalog.json
          python -m zipfile -l dist/*.whl | grep app.html

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  all-checks:
    # A single stable gate for branch protection. Requiring the matrix jobs
    # directly would mean editing the protection rule every time the Python or
    # OS list changes; this job's name never changes.
    name: All checks passed
    if: always()
    needs: [test, no-dependencies, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything upstream failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi
          echo "All required jobs passed."
