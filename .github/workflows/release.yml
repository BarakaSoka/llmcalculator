name: Release

# Publishes to PyPI when a version tag is pushed:
#     git tag v0.1.0 && git push origin v0.1.0
#
# Authentication uses PyPI Trusted Publishing (OIDC), so there is no API token
# stored in this repository. Configure it once at
# https://pypi.org/manage/project/llmcalculator/settings/publishing/
# with owner=BarakaSoka, repo=llmcalculator, workflow=release.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import re,pathlib;print(re.search(r'version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG does not match pyproject version $VER"
            exit 1
          fi
          echo "Releasing version $VER"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
