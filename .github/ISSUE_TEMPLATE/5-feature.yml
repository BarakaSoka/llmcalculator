name: Feature request
description: Suggest something new
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: The situation you are in, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I would be willing to open a PR for this
